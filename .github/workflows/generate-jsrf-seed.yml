name: Generate JSRF Archipelago Seed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out prototype files
        uses: actions/checkout@v4

      - name: Check out Archipelago
        uses: actions/checkout@v4
        with:
          repository: ArchipelagoMW/Archipelago
          ref: main
          path: archipelago-core
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: archipelago-core/requirements.txt

      - name: Install Archipelago requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'setuptools>=75,<81'
          python -m pip install -r archipelago-core/requirements.txt

      - name: Install custom world and player config
        run: |
          mkdir -p archipelago-core/Players archipelago-core/output
          cp jsrf.apworld archipelago-core/worlds/jsrf.apworld
          cp JSRF_Test.yaml archipelago-core/Players/JSRF_Test.yaml
          python - <<'PY'
          import json, zipfile
          p = 'archipelago-core/worlds/jsrf.apworld'
          with zipfile.ZipFile(p) as z:
              names = set(z.namelist())
              assert {'jsrf/__init__.py','jsrf/locations.json','jsrf/archipelago.json'} <= names
              m = json.loads(z.read('jsrf/archipelago.json'))
              assert m['game'] == 'Jet Set Radio Future'
              loc = json.loads(z.read('jsrf/locations.json'))['locations']
              assert len(loc) == 105, len(loc)
              ids = [row['provisional_ap_location_id'] for row in loc]
              assert len(set(ids)) == 105
              print('Archive verified: 105 location IDs; manifest game:', m['game'])
          PY

      - name: Generate real Archipelago multiworld
        working-directory: archipelago-core
        env:
          SKIP_REQUIREMENTS_UPDATE: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          python Generate.py \
            --player_files_path Players \
            --outputpath output \
            --multi 1 \
            --spoiler 1
          ls -lah output
          ls output/AP_*.zip >/dev/null

      - name: Upload generated seed ZIP
        uses: actions/upload-artifact@v4
        with:
          name: JSRF-Archipelago-Generated-Seed
          path: archipelago-core/output/AP_*.zip
          if-no-files-found: error
          retention-days: 7
